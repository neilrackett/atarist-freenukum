[package]
name = "freenukum-rs"
version = "0.3.0"
authors = ["Wolfgang Silbermayr <wolfgang@silbermayr.at>"]
edition = "2018"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1.0.32"
bitvec = "0.17"
directories = "3.0.1"
