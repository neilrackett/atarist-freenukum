[package]
name = "freenukum-rs"
version = "0.3.0"
authors = ["Wolfgang Silbermayr <wolfgang@silbermayr.at>"]
edition = "2018"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bitvec = "0.17"
dirs = "2"
sdl2 = "0.33"
serde = "1"
serde_derive = "1"
transdl = { path = "transdl" }
libc = "0.2.77"
anyhow = "1.0.32"

[build-dependencies]
cbindgen = "0.14.4"
