[package]
name = "freenukum"
version = "0.3.0"
authors = ["Wolfgang Silbermayr <wolfgang@silbermayr.at>"]
edition = "2018"
default-run = "freenukum"

[features]
default = []
build_unrefactored = []

[dependencies]
anyhow = "1.0.33"
directories = "3.0.1"
libc = "0.2.77"
sdl2 = { version = "0.34", features = ["ttf"] }
serde = "1"
serde_derive = "1"
toml = "0.5.6"
rand = "0.7.3"
explode = "0.1.2"
structopt = "0.3.20"
zip = "0.5.8"
log = "0.4.11"
